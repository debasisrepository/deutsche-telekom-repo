version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_SPEC: ".[postgres]"
    environment:
      DATABASE_URL: postgresql+psycopg://procurement:procurement_dev_pass@postgres:5432/procurement
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "true"
      CORS_ORIGINS: http://localhost
      RATE_LIMIT_ENABLED: "true"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
