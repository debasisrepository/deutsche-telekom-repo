name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: procurement_test
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,postgres]

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          ruff check app

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          mypy app --ignore-missing-imports

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://procurement:test_pass@localhost:5432/procurement_test
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://procurement:test_pass@localhost:5432/procurement_test
        run: |
          pytest -v --tb=short

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Lint
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Type check
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: |
          npm run build

      - name: Run unit tests
        working-directory: ./frontend
        run: |
          npm run test
