services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/dev.env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CORS_ORIGINS: http://localhost,http://localhost:80
      API_PORT: 8000
    volumes:
      - database-data:/data
    x-preview-port: 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_HOST: backend
    ports:
      - "80:80"
    depends_on:
      - backend
    x-preview-port: 80

volumes:
  database-data:
